<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meus leads · MKT Geo</title>
<style>
  :root{--bg:#07070F;--panel:#0E0E1F;--ink:#EDEDF5;--soft:#9C9CBE;--blue:#2F9BFF;--purple:#8A3FFC;--line:rgba(138,63,252,.28);--red:#FF3B5C;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px;max-width:560px;margin-inline:auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--soft);font-size:13px;margin:0 0 16px;}
  .barra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  button{font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--blue),var(--purple));border:none;border-radius:9px;padding:11px 16px;cursor:pointer;}
  button.sec{background:transparent;border:1.5px solid rgba(237,237,245,.2);color:var(--soft);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .nome{font-weight:800;font-size:16px;margin:0 0 2px;}
  .meta{color:var(--soft);font-size:12.5px;margin:0 0 10px;}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;}
  .acoes a{font-size:13.5px;font-weight:700;text-decoration:none;color:#fff;border:1.5px solid rgba(47,155,255,.55);border-radius:8px;padding:9px 14px;}
  .acoes a.w{background:#1FAF5A;border-color:#1FAF5A;}
  .msg{color:var(--soft);font-size:14px;line-height:1.5;}
  .msg.erro{color:var(--red);}
  [hidden]{display:none !important;}
  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  button.chip{background:transparent;border:1.5px solid rgba(237,237,245,.2);color:var(--soft);padding:8px 12px;font-size:13px;border-radius:20px;}
  button.chip.on{background:linear-gradient(90deg,var(--blue),var(--purple));border-color:transparent;color:#fff;}
  .st{display:flex;gap:6px;margin:0 0 12px;}
  .st button{flex:1;background:transparent;border:1.5px solid rgba(237,237,245,.18);color:var(--soft);padding:9px 6px;font-size:13px;border-radius:8px;}
  .st button.on.novo{background:#2F9BFF;border-color:#2F9BFF;color:#fff;}
  .st button.on.chamei{background:#E8A317;border-color:#E8A317;color:#1a1200;}
  .st button.on.fechou{background:#1FAF5A;border-color:#1FAF5A;color:#fff;}
</style>
</head>
<body>
<h1>Meus leads</h1>
<p class="sub" id="sub">Carregando…</p>

<div id="telaLogin" hidden>
  <p class="msg">Área só para a equipe da MKT Geo. Entre com a sua conta Google.</p>
  <button id="btnEntrar">Entrar com Google</button>
</div>

<div id="telaLista" hidden>
  <div class="barra">
    <button id="btnAtualizar">Atualizar</button>
    <button id="btnSair" class="sec">Sair</button>
  </div>
  <div class="filtros" id="filtros"></div>
  <p class="msg erro" id="aviso" hidden></p>
  <div id="lista"></div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  import { getFirestore, collection, query, orderBy, limit, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const $ = (id) => document.getElementById(id);
  const sub = $('sub'), lista = $('lista'), telaLogin = $('telaLogin'), telaLista = $('telaLista'), filtrosEl = $('filtros'), aviso = $('aviso');
  function el(t, c, txt){ const e = document.createElement(t); if(c) e.className = c; if(txt != null) e.textContent = txt; return e; }

  const STATUS = [['novo', 'Novo'], ['chamei', 'Já chamei'], ['fechou', 'Fechou']];
  let todos = [], filtro = 'todos', db = null;

  const c = window.MKT_FIREBASE;
  if(!c || !c.apiKey || !c.projectId){
    sub.textContent = 'Firebase ainda não configurado.';
  } else {
    const app = initializeApp({ apiKey: c.apiKey, authDomain: c.projectId + '.firebaseapp.com', projectId: c.projectId });
    const auth = getAuth(app);
    db = getFirestore(app);

    $('btnEntrar').addEventListener('click', async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch(e){
        sub.textContent = (e && e.code === 'auth/popup-blocked')
          ? 'O navegador bloqueou a janela de login. Libere pop-ups para este site e tente de novo.'
          : 'Não consegui entrar (' + ((e && e.code) || 'erro') + ').';
      }
    });
    $('btnSair').addEventListener('click', () => signOut(auth));
    $('btnAtualizar').addEventListener('click', carregar);

    onAuthStateChanged(auth, (user) => {
      if(user){ telaLogin.hidden = true; telaLista.hidden = false; carregar(); }
      else { telaLista.hidden = true; telaLogin.hidden = false; todos = []; lista.textContent = ''; sub.textContent = 'Faça login para ver os contatos.'; }
    });
  }

  function mostrarAviso(txt){ aviso.textContent = txt || ''; aviso.hidden = !txt; }

  async function carregar(){
    lista.textContent = ''; filtrosEl.textContent = ''; mostrarAviso('');
    sub.textContent = 'Carregando…';
    try {
      const snap = await getDocs(query(collection(db, 'leads'), orderBy('criadoEm', 'desc'), limit(300)));
      todos = snap.docs.map((d) => {
        const f = d.data();
        const st = STATUS.some((s) => s[0] === f.status) ? f.status : 'novo';
        return {
          id: d.id, nome: f.nome || '', telefone: f.telefone || '', email: f.email || '', plano: f.plano || '', status: st,
          quando: f.criadoEm && f.criadoEm.toDate
            ? f.criadoEm.toDate().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : ''
        };
      });
      render();
    } catch(e){
      if(e && e.code === 'permission-denied'){
        sub.textContent = 'Esta conta não tem permissão para ver os contatos. Saia e entre com a conta autorizada.';
      } else {
        sub.textContent = 'Não consegui carregar (' + ((e && e.code) || 'erro') + '). Confira a internet.';
      }
    }
  }

  function render(){
    lista.textContent = ''; filtrosEl.textContent = '';
    [['todos', 'Todos']].concat(STATUS).forEach((par) => {
      const k = par[0], rot = par[1];
      const n = k === 'todos' ? todos.length : todos.filter((x) => x.status === k).length;
      const b = el('button', 'chip' + (filtro === k ? ' on' : ''), rot + ' (' + n + ')');
      b.addEventListener('click', () => { filtro = k; render(); });
      filtrosEl.appendChild(b);
    });
    const vis = todos.filter((x) => filtro === 'todos' || x.status === filtro);
    sub.textContent = todos.length + (todos.length === 1 ? ' contato' : ' contatos');
    if(!vis.length){ lista.appendChild(el('p', 'msg', todos.length ? 'Nenhum contato neste filtro.' : 'Nenhum contato registrado ainda.')); return; }
    vis.forEach((item) => {
      const card = el('div', 'card');
      card.appendChild(el('p', 'nome', item.nome));
      card.appendChild(el('p', 'meta', [item.plano, item.quando, item.email].filter(Boolean).join(' · ')));
      const st = el('div', 'st');
      STATUS.forEach((s) => {
        const b = el('button', s[0] + (item.status === s[0] ? ' on' : ''), s[1]);
        b.addEventListener('click', () => mudarStatus(item, s[0]));
        st.appendChild(b);
      });
      card.appendChild(st);
      let dig = String(item.telefone).replace(/\D/g, '');
      if(dig.length <= 11) dig = '55' + dig;
      const ac = el('div', 'acoes');
      const w = el('a', 'w', 'WhatsApp');
      const primeiro = String(item.nome).split(' ')[0];
      w.href = 'https://wa.me/' + dig + '?text=' + encodeURIComponent('Oi ' + primeiro + '! Aqui é da MKT Geo Solutions, tudo bem? Passando pra saber se ficou alguma dúvida sobre a proposta.');
      w.target = '_blank'; w.rel = 'noopener';
      const l = el('a', null, 'Ligar'); l.href = 'tel:+' + dig;
      ac.appendChild(w); ac.appendChild(l); card.appendChild(ac); lista.appendChild(card);
    });
  }

  async function mudarStatus(item, novo){
    if(item.status === novo) return;
    const antigo = item.status;
    item.status = novo; mostrarAviso(''); render();
    try { await updateDoc(doc(db, 'leads', item.id), { status: novo }); }
    catch(e){
      item.status = antigo; render();
      mostrarAviso('Não consegui salvar o status (' + ((e && e.code) || 'erro') + '). Confira a internet e tente de novo.');
    }
  }
</script>
</body>
</html>
