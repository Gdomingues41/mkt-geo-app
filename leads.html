<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meus leads · MKT Geo</title>
<style>
  :root{--bg:#07070F;--panel:#0E0E1F;--ink:#EDEDF5;--soft:#9C9CBE;--blue:#2F9BFF;--purple:#8A3FFC;--line:rgba(138,63,252,.28);--red:#FF3B5C;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px;max-width:560px;margin-inline:auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--soft);font-size:13px;margin:0 0 16px;}
  .barra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  button{font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--blue),var(--purple));border:none;border-radius:9px;padding:11px 16px;cursor:pointer;}
  button.sec{background:transparent;border:1.5px solid rgba(237,237,245,.2);color:var(--soft);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .nome{font-weight:800;font-size:16px;margin:0 0 2px;}
  .meta{color:var(--soft);font-size:12.5px;margin:0 0 10px;}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;}
  .acoes a{font-size:13.5px;font-weight:700;text-decoration:none;color:#fff;border:1.5px solid rgba(47,155,255,.55);border-radius:8px;padding:9px 14px;}
  .acoes a.w{background:#1FAF5A;border-color:#1FAF5A;}
  .msg{color:var(--soft);font-size:14px;line-height:1.5;}
  .msg.erro{color:var(--red);}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<h1>Meus leads</h1>
<p class="sub" id="sub">Carregando…</p>

<div id="telaLogin" hidden>
  <p class="msg">Área só para a equipe da MKT Geo. Entre com a sua conta Google.</p>
  <button id="btnEntrar">Entrar com Google</button>
</div>

<div id="telaLista" hidden>
  <div class="barra">
    <button id="btnAtualizar">Atualizar</button>
    <button id="btnSair" class="sec">Sair</button>
  </div>
  <div id="lista"></div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  import { getFirestore, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const $ = (id) => document.getElementById(id);
  const sub = $('sub'), lista = $('lista'), telaLogin = $('telaLogin'), telaLista = $('telaLista');
  function el(t, c, txt){ const e = document.createElement(t); if(c) e.className = c; if(txt != null) e.textContent = txt; return e; }

  const c = window.MKT_FIREBASE;
  if(!c || !c.apiKey || !c.projectId){
    sub.textContent = 'Firebase ainda não configurado.';
  } else {
    const app = initializeApp({ apiKey: c.apiKey, authDomain: c.projectId + '.firebaseapp.com', projectId: c.projectId });
    const auth = getAuth(app);
    const db = getFirestore(app);

    $('btnEntrar').addEventListener('click', async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch(e){
        sub.textContent = (e && e.code === 'auth/popup-blocked')
          ? 'O navegador bloqueou a janela de login. Libere pop-ups para este site e tente de novo.'
          : 'Não consegui entrar (' + ((e && e.code) || 'erro') + ').';
      }
    });
    $('btnSair').addEventListener('click', () => signOut(auth));
    $('btnAtualizar').addEventListener('click', carregar);

    onAuthStateChanged(auth, (user) => {
      if(user){ telaLogin.hidden = true; telaLista.hidden = false; carregar(); }
      else { telaLista.hidden = true; telaLogin.hidden = false; lista.textContent = ''; sub.textContent = 'Faça login para ver os contatos.'; }
    });

    async function carregar(){
      lista.textContent = '';
      sub.textContent = 'Carregando…';
      try {
        const snap = await getDocs(query(collection(db, 'leads'), orderBy('criadoEm', 'desc'), limit(300)));
        const docs = snap.docs;
        sub.textContent = docs.length + (docs.length === 1 ? ' contato' : ' contatos');
        if(!docs.length){ lista.appendChild(el('p', 'msg', 'Nenhum contato registrado ainda.')); return; }
        docs.forEach((d) => {
          const f = d.data();
          const card = el('div', 'card');
          card.appendChild(el('p', 'nome', f.nome || ''));
          const quando = f.criadoEm && f.criadoEm.toDate
            ? f.criadoEm.toDate().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
          card.appendChild(el('p', 'meta', [f.plano, quando, f.email].filter(Boolean).join(' · ')));
          let dig = String(f.telefone || '').replace(/\D/g, '');
          if(dig.length <= 11) dig = '55' + dig;
          const ac = el('div', 'acoes');
          const w = el('a', 'w', 'WhatsApp');
          const primeiro = String(f.nome || '').split(' ')[0];
          w.href = 'https://wa.me/' + dig + '?text=' + encodeURIComponent('Oi ' + primeiro + '! Aqui é da MKT Geo Solutions, tudo bem? Passando pra saber se ficou alguma dúvida sobre a proposta.');
          w.target = '_blank'; w.rel = 'noopener';
          const l = el('a', null, 'Ligar'); l.href = 'tel:+' + dig;
          ac.appendChild(w); ac.appendChild(l); card.appendChild(ac); lista.appendChild(card);
        });
      } catch(e){
        if(e && e.code === 'permission-denied'){
          sub.textContent = 'Esta conta não tem permissão para ver os contatos. Saia e entre com a conta autorizada.';
        } else {
          sub.textContent = 'Não consegui carregar (' + ((e && e.code) || 'erro') + '). Confira a internet.';
        }
      }
    }
  }
</script>
</body>
</html>
