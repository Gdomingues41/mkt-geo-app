<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#061443;color:#e6edf3;font-size:15px;line-height:1.4}
header{padding:14px 14px 0;position:sticky;top:0;background:#061443;z-index:5;border-bottom:1px solid #1a3596}
h1{font-size:18px;display:flex;gap:8px;align-items:center}
h1 small{font-weight:400;color:#a6a2a2;font-size:12px}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{background:none;border:0;color:#a6a2a2;padding:9px 12px;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:#1cfeba;border-color:#1cfeba}
main{padding:14px;max-width:1100px;margin:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#0a2472;border:1px solid #27479f;color:#e6edf3;border-radius:8px;padding:9px 10px;font:inherit;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-size:12px;color:#a6a2a2;display:block;margin:8px 0 3px}
.btn{background:#1a3596;border:1px solid #27479f;color:#e6edf3;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:#1cfeba;border-color:#1cfeba;color:#04133a;font-weight:600}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.red{color:#ff7b7b}
.card{background:#0a2472;border:1px solid #1a3596;border-radius:12px;padding:12px;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#12308a;color:#c9cbd6;margin-right:4px}
.tag.p{background:#0b5d1e;color:#1cfeba}
.score{font-weight:700;font-size:18px;color:#1cfeba;min-width:38px;text-align:right}
.muted{color:#a6a2a2;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{border:1px solid #27479f;background:none;color:#a6a2a2;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:#1cfeba;border-color:#1cfeba;color:#04133a;font-weight:600}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{min-width:230px;width:230px;background:#081a52;border:1px solid #1a3596;border-radius:12px;padding:8px}
.col h3{font-size:13px;color:#a6a2a2;margin:2px 4px 8px;display:flex;justify-content:space-between}
.lead{background:#0a2472;border:1px solid #27479f;border-radius:10px;padding:9px;margin-bottom:8px}
.lead b{display:block;margin-bottom:3px}
.lead .row{margin-top:7px;gap:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#0a2472;border:1px solid #1a3596;border-radius:10px;padding:10px}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
button.stat:hover{border-color:#1cfeba;transform:translateY(-1px);box-shadow:0 4px 14px rgba(28,254,186,.18)}
button.stat:active{transform:scale(.97)}
.stat b{font-size:20px;color:#1cfeba;display:block}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:#061443;border:1px solid #27479f;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px}
.sheet h2{font-size:16px;margin-bottom:6px}
.msg{margin-top:10px}
.msg .t{font-size:12px;color:#1cfeba;margin-bottom:3px}
.note{background:#2a2a00;border:1px solid #ffff00;border-radius:10px;padding:10px;font-size:13px;color:#fffbb3;margin-bottom:12px}

header{display:flex;gap:10px;align-items:center;padding:10px 14px}
header h1{font-size:17px}
#burger{background:none;border:1px solid #27479f;color:#e6edf3;border-radius:8px;width:40px;height:38px;font-size:20px;cursor:pointer;flex:none}
#scrim{position:fixed;inset:0;background:#000b;display:none;z-index:30}
#scrim.on{display:block}
#panel{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:#061443;border-right:1px solid #1a3596;transform:translateX(-100%);transition:transform .2s;z-index:31;padding:14px 10px;overflow:auto}
#panel.on{transform:none}
.mi{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#e6edf3;padding:12px 10px;border-radius:8px;font-size:15px;cursor:pointer;text-align:left}
.mi.on{background:#0b5d1e;color:#1cfeba}
.mi small{margin-left:auto;color:#a6a2a2}
.bar{height:8px;background:#1a3596;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#1cfeba}
.lead.click{cursor:pointer}

header{background:#0a2472;border-bottom:1px solid #27479f}
#panel{background:#0a2472}
.mi.on{background:#061443;color:#1cfeba}
.tag{background:#12308a;color:#e6edf3}
.tag.p{background:#0b5d1e;color:#1cfeba}
.stat b{color:#1cfeba}
.score{color:#1cfeba}
.btn.red{color:#ff7b7b}
.btn{min-height:36px}
#abar{display:none}
@media(max-width:640px){
  main{padding:12px 12px 90px}
  body{font-size:16px}
  input,select,textarea{font-size:16px}
  .btn{min-height:44px;padding:10px 14px}
  .btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
  .chip{padding:8px 14px}
  .board{flex-direction:column;overflow:visible}
  .col{width:100%;min-width:0}
  #abar{display:flex;position:fixed;left:0;right:0;bottom:0;gap:8px;padding:10px 12px;background:#0a2472;border-top:1px solid #27479f;z-index:10}
  #abar .btn{flex:1;text-align:center;padding:10px 6px;font-size:13px}
}

.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
.ic.star{color:#ffff00;fill:#ffff00}
header h1 .ic{color:#1cfeba;width:1.35em;height:1.35em;margin-right:2px}
header h1{display:flex;align-items:center;gap:6px}
#burger{display:flex;align-items:center;justify-content:center;padding:0}
#burger .ic{width:22px;height:22px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em}
.mi .ic{width:1.3em;height:1.3em;color:#1cfeba;opacity:.9;transition:transform .2s}
.mi:hover .ic{transform:scale(1.15)}
.btn,.chip,.mi,#burger,.lead,.card{transition:transform .15s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease,filter .2s ease}
.btn,.chip,.mi,#burger{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.mi:active,#burger:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.pri{box-shadow:0 2px 10px rgba(28,254,186,.18)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
.btn.pri .rip,.chip.on .rip{background:rgba(4,19,58,.28)}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.enter>*{animation:fadeUp .3s ease both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}
:focus-visible{outline:2px solid #1cfeba;outline-offset:2px}
@media(hover:hover){

  .btn.pri:hover{filter:brightness(1.08);box-shadow:0 0 0 3px rgba(28,254,186,.22),0 8px 22px rgba(28,254,186,.28)}
  .chip:hover{border-color:#1cfeba;color:#1cfeba;transform:translateY(-1px)}
  .chip.on:hover{color:#04133a}
  .mi:hover{background:#12308a}
  #burger:hover{border-color:#1cfeba;color:#1cfeba}
  .card[onclick]:hover,.lead.click:hover{border-color:#1cfeba;transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.4)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bdg{margin-left:auto;background:#d10000;color:#fff!important;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;min-width:22px;text-align:center}
.bdg.y{background:#ffff00;color:#04133a!important}
#burger.dot::after{content:'';position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:#d10000;box-shadow:0 0 0 2px #0a2472}
.chip{flex:none}
.syn{margin-left:auto;background:none;border:1px solid #27479f;color:#a6a2a2;border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.syn.ok{color:#1cfeba}.syn.err{color:#ff7b7b}.syn.sync{color:#ffff00}
.syn.sync .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

async function buscarMaps(more){
  const tok=getTok();
  if(!tok){ui.err='Cole a senha do Radar primeiro.';render();return;}
  const termo=(document.getElementById('bm_t')||{}).value||ui.bmT||'';
  const nicho=(document.getElementById('bm_n')||{}).value||ui.bmN||'';
  if(termo.trim().length<2){ui.err='Digite o que buscar.';render();return;}
  ui.bmT=termo;ui.bmN=nicho;ui.bmBusy=true;ui.err='';render();
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-radar-token':tok},
      body:JSON.stringify({termo:termo.trim(),cidade:S.city,pageToken:more?ui.bmNext:''})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ui.err=r.status===401?'Senha inválida. Confira e cole de novo.':(d.erro||'Erro na busca.');}
    else{ui.bmRes=(more?(ui.bmRes||[]):[]).concat(d.leads||[]);ui.bmNext=d.nextPageToken||'';if(!ui.bmRes.length)ui.err='Nada encontrado. Tente outro termo ou bairro.';sortRes();}
  }catch(e){ui.err='Não consegui falar com o servidor. Abra o Radar pela página hospedada (github.io), não por dentro do Claude.';}
  ui.bmBusy=false;render();
}

async function buscarMulti(){
  const tok=getTok(),reg=ui.bmReg;
  if(!tok||!reg||!REGIOES[reg])return;
  const termo=((document.getElementById('bm_t')||{}).value||ui.bmT||'').trim();
  const nicho=(document.getElementById('bm_n')||{}).value||ui.bmN||'';
  if(termo.length<2){ui.err='Digite o que buscar.';render();return;}
  ui.bmT=termo;ui.bmN=nicho;ui.bmBusy=true;ui.bmStop=false;ui.err='';ui.bmRes=[];ui.bmNext='';
  const cids=REGIOES[reg],seen=new Set();let skipped=0;
  for(let i=0;i<cids.length&&!ui.bmStop;i++){
    ui.bmProg=(i+1)+'/'+cids.length+': '+cids[i];render();
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-radar-token':tok},body:JSON.stringify({termo,cidade:cids[i],pageToken:''})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){ui.err=r.status===401?'Senha inválida. Confira e cole de novo.':r.status===429?'Limite de buscas por minuto. Aguarde 1 minuto e tente de novo.':(d.erro||'Erro na busca.');break;}
      (d.leads||[]).forEach(x=>{if(seen.has(x.placeId))return;seen.add(x.placeId);if(jaNoFunil(x)){skipped++;return;}x._c=cids[i];ui.bmRes.push(x);});
    }catch(e){ui.err='Não consegui falar com o servidor. Abra o Radar pela página hospedada (github.io).';break;}
    if(i<cids.length-1&&!ui.bmStop)await new Promise(ok=>setTimeout(ok,7000));
  }
  ui.bmBusy=false;ui.bmProg='';sortRes();
  if(!ui.err)ui.err=ui.bmRes.length?'Busca em '+cids.length+' cidades: '+ui.bmRes.length+' leads novos'+(skipped?' ('+skipped+' já estavam no funil)':'')+'.':'Nada novo encontrado nessas cidades.';
  render();
}

const CL={st:'load',user:null,db:null,fs:null,AU:null,auth:null,seen:{},metaSeen:'',timer:null,busy:false,unsub:null,err:'',last:0};
const metaOf=()=>JSON.stringify({city:S.city,camp:S.camp,videos:S.videos,extra:S.extra});
const leadJ=l=>{const c=Object.assign({},l);delete c.u;return JSON.stringify(c);};
function stamp(){
  let ch=false;S.tomb=S.tomb||{};const ids={};
  S.leads.forEach(l=>{ids[l.id]=1;const j=leadJ(l);if(CL.seen[l.id]!==j){l.u=Date.now();CL.seen[l.id]=j;ch=true;}});
  Object.keys(CL.seen).forEach(id=>{if(!ids[id]){S.tomb[id]=Date.now();delete CL.seen[id];ch=true;}});
  const m=metaOf();if(m!==CL.metaSeen){S.mu=Date.now();CL.metaSeen=m;ch=true;}
  if(ch)persist();return ch;
}
function merge(A,R){
  const rl=(R&&R.leads)||{},rt=(R&&R.tomb)||{},lt=A.tomb||{},lm={};
  A.leads.forEach(l=>lm[l.id]=l);
  const order=A.leads.map(l=>l.id).concat(Object.keys(rl).filter(id=>!lm[id])).concat(Object.keys(rt)).concat(Object.keys(lt));
  const seen=new Set(),leads=[],tomb={};
  order.forEach(id=>{
    if(seen.has(id))return;seen.add(id);
    const a=lm[id],b=rl[id],t=Math.max(rt[id]||0,lt[id]||0);
    const best=(a&&b)?((b.u||0)>(a.u||0)?b:a):(a||b);
    if(best&&(!t||(best.u||0)>t))leads.push(best);else if(t)tomb[id]=t;
  });
  const useR=R&&(R.mu||0)>(A.mu||0),M=useR?R:A;
  return {leads,tomb,city:M.city||A.city,camp:M.camp||A.camp,videos:M.videos||A.videos||{},extra:M.extra||A.extra||[],mu:Math.max(A.mu||0,(R&&R.mu)||0)};
}
const snapS=()=>JSON.stringify([S.leads,S.tomb,S.city,S.camp,S.videos,S.extra]);
function applyMerged(m){
  if(!m.city)m.city='Praia Grande';
  S.leads=m.leads;S.tomb=m.tomb;S.city=m.city;S.camp=m.camp;S.videos=m.videos;S.extra=m.extra;S.mu=m.mu;
  CL.seen={};S.leads.forEach(l=>CL.seen[l.id]=leadJ(l));CL.metaSeen=metaOf();persist();
}
function needPush(m,R){
  if(!R)return m.leads.length>0||Object.keys(m.tomb).length>0;
  const rl=R.leads||{},rt=R.tomb||{};
  return m.leads.some(l=>!rl[l.id]||(rl[l.id].u||0)<(l.u||0))||Object.keys(m.tomb).some(id=>(rt[id]||0)<m.tomb[id])||(m.mu||0)>(R.mu||0);
}
function softRender(){
  const el=document.activeElement,t=el&&el.tagName;

function schedulePush(ms){clearTimeout(CL.timer);CL.timer=setTimeout(pushNow,ms==null?1500:ms);}

async function pushNow(){
  if(!CL.user||!CL.db)return;
  if(CL.busy){schedulePush(1500);return;}
  CL.busy=true;setSt('sync');
  try{
    stamp();
    const {doc,runTransaction,serverTimestamp}=CL.fs,ref=doc(CL.db,'radar',CL.user.uid);
    const m=await runTransaction(CL.db,async tx=>{
      const snap=await tx.get(ref),mm=merge(S,snap.exists()?snap.data():null),map={};
      mm.leads.forEach(l=>map[l.id]=l);
      tx.set(ref,JSON.parse(JSON.stringify({leads:map,tomb:mm.tomb,city:mm.city,camp:mm.camp,videos:mm.videos,extra:mm.extra,mu:mm.mu}))
        ,{});
      tx.update(ref,{updatedAt:serverTimestamp()});
      return mm;
    });
    const before=snapS();applyMerged(m);CL.last=Date.now();CL.err='';
    if(snapS()!==before)softRender();
    setSt('ok');
  }catch(e){CL.err=(e&&e.code)||String(e);setSt('err');}
  CL.busy=false;
}
function startSync(){
  stopSync();setSt('sync');
  const {doc,onSnapshot}=CL.fs,ref=doc(CL.db,'radar',CL.user.uid);
  CL.unsub=onSnapshot(ref,snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const R=snap.exists()?snap.data():null,before=snapS(),m=merge(S,R);
    applyMerged(m);
    if(snapS()!==before)softRender();
    if(needPush(m,R))schedulePush(300);else{CL.last=Date.now();setSt('ok');}
  },e=>{CL.err=(e&&e.code)||String(e);setSt('err');});
}
function stopSync(){if(CL.unsub){CL.unsub();CL.unsub=null;}clearTimeout(CL.timer);}

  return `${vSync()}<div class="note">Sem entrar na conta, os dados ficam só neste navegador. O backup abaixo é opcional.</div>
  <label>Backup (copie e guarde)</label><textarea id="bk" style="min-height:140px">${esc(JSON.stringify(S))}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="cp('bk',this)">Copiar backup</button>
  <button class="btn pri" onclick="restore()">Restaurar do texto acima</button></div>
  <div class="muted" id="bkmsg" style="margin-top:8px"></div>`;
}
function restore(){
  try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.leads))throw 0;S=Object.assign({city:'Praia Grande',extra:[],leads:[],videos:{},camp:'bf'},o);save();render();}
  catch(e){$('#bkmsg').textContent='Texto inválido. Cole o backup completo e tente de novo.';}
}

function openModal(h){$('#sheet').innerHTML=ico(h);$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
setInterval(renderMenu,60000);
{const h=document.querySelector('header');h.innerHTML=ico(h.innerHTML);}
ui.anim=true;render();setSt('load');cloudInit();
</script>
</body>
</html>
