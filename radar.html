<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Prospecção</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#e6edf3;font-size:15px;line-height:1.4}
header{padding:14px 14px 0;position:sticky;top:0;background:#0d1117;z-index:5;border-bottom:1px solid #21262d}
h1{font-size:18px;display:flex;gap:8px;align-items:center}
h1 small{font-weight:400;color:#8b949e;font-size:12px}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{background:none;border:0;color:#8b949e;padding:9px 12px;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:#2dd4bf;border-color:#2dd4bf}
main{padding:14px;max-width:1100px;margin:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:9px 10px;font:inherit;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-size:12px;color:#8b949e;display:block;margin:8px 0 3px}
.btn{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:#0f766e;border-color:#0f766e;color:#fff}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.red{color:#f87171}
.card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:12px;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#1f2937;color:#9ca3af;margin-right:4px}
.tag.p{background:#0f2e2b;color:#5eead4}
.score{font-weight:700;font-size:18px;color:#2dd4bf;min-width:38px;text-align:right}
.muted{color:#8b949e;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{border:1px solid #30363d;background:none;color:#8b949e;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:#0f766e;border-color:#0f766e;color:#fff}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{min-width:230px;width:230px;background:#0f141b;border:1px solid #21262d;border-radius:12px;padding:8px}
.col h3{font-size:13px;color:#8b949e;margin:2px 4px 8px;display:flex;justify-content:space-between}
.lead{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:9px;margin-bottom:8px}
.lead b{display:block;margin-bottom:3px}
.lead .row{margin-top:7px;gap:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:10px}
.stat b{font-size:20px;color:#2dd4bf;display:block}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:#0d1117;border:1px solid #30363d;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px}
.sheet h2{font-size:16px;margin-bottom:6px}
.msg{margin-top:10px}
.msg .t{font-size:12px;color:#2dd4bf;margin-bottom:3px}
.note{background:#1c1917;border:1px solid #44403c;border-radius:10px;padding:10px;font-size:13px;color:#d6d3d1;margin-bottom:12px}

header{display:flex;gap:10px;align-items:center;padding:10px 14px}
header h1{font-size:17px}
#burger{background:none;border:1px solid #30363d;color:#e6edf3;border-radius:8px;width:40px;height:38px;font-size:20px;cursor:pointer;flex:none}
#scrim{position:fixed;inset:0;background:#000a;display:none;z-index:30}
#scrim.on{display:block}
#panel{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:#0d1117;border-right:1px solid #21262d;transform:translateX(-100%);transition:transform .2s;z-index:31;padding:14px 10px;overflow:auto}
#panel.on{transform:none}
.mi{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#c9d1d9;padding:12px 10px;border-radius:8px;font-size:15px;cursor:pointer;text-align:left}
.mi.on{background:#0f2e2b;color:#5eead4}
.mi small{margin-left:auto;color:#8b949e}
.bar{height:8px;background:#21262d;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#2dd4bf}
.lead.click{cursor:pointer}
</style>
</head>
<body>
<header><button id="burger" onclick="toggleMenu()" aria-label="Menu">☰</button><h1>📡 <span id="ttl">Radar</span></h1></header>
<div id="scrim" onclick="toggleMenu()"></div><aside id="panel"></aside>
<main id="app"></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const PRODUCTS=[
 {id:'mkt',nome:'MKT Geo Solutions',oferta:'vídeos de anúncio com avatar de IA para pequenos negócios',preco:'Avulso R$149,90 · Entrada R$299,90/mês (2 vídeos) · Padrão R$499,90/mês (4 vídeos)',dor:'não tem tempo nem equipe para produzir vídeo e aparecer nas redes',pergunta:'vocês já usam vídeos nas redes para atrair clientes, ou falta tempo/equipe para produzir?'},
 {id:'pod',nome:'Pódium CRM',oferta:'CRM em Kanban integrado ao WhatsApp para autoescolas',preco:'sob consulta (validado numa autoescola real)',dor:'leads do WhatsApp se perdem e ninguém acompanha até a matrícula',pergunta:'quando um aluno chama no WhatsApp e não fecha na hora, vocês conseguem acompanhar esse contato até a matrícula?'},
 {id:'lab',nome:'Labortech',oferta:'sistema de gestão de laboratório (amostras, resultados, laudos digitais)',preco:'Básico R$197/mês · Profissional R$397 · Empresarial R$797',dor:'resultados em planilha/papel, laudos manuais e sem rastreabilidade',pergunta:'como vocês controlam hoje os resultados das análises e emitem os laudos: planilha, papel ou sistema?'},
 {id:'rc',nome:'RouteCheck',oferta:'PWA de supervisão de campo com GPS, checklist e fotos',preco:'a definir',dor:'não há prova de que o supervisor visitou a loja nem o que encontrou lá',pergunta:'como vocês comprovam hoje que o supervisor visitou cada unidade e o que ele encontrou?'},
 {id:'sc',nome:'Scanlist Market',oferta:'app de lista de compras com leitor de código de barras',preco:'R$9,90 a R$29,90',dor:'estourar o orçamento no mercado sem comparar preços',pergunta:'você costuma montar a lista e comparar preços antes de ir ao mercado?'}
];
// facil / ticket / prox = 1..5  (prox = proximidade: já tenho contato ou conheço a dor)
const SEED=[
 {n:'Confeitarias e docerias',p:'mkt',dor:'vendem por Instagram e WhatsApp e o Natal é o pico de encomendas (panetone, caixas, ceias)',f:5,t:2,x:4,camp:'natal',q:['confeitaria','doceria','bolos e doces por encomenda','panetone artesanal','chocotone','brigadeiro gourmet','bolo decorado','doces para festa','cesta e caixa de presente','ceia de natal encomenda'],ig:'doceria bolos encomendas'},
 {n:'Salões de beleza e barbearias',p:'mkt',dor:'dependem de Instagram e não têm tempo para vídeo',f:5,t:2,x:4},
 {n:'Joalherias e relojoarias',p:'mkt',dor:'produto visual que vende bem em vídeo curto',f:4,t:3,x:3},
 {n:'Autopeças e oficinas',p:'mkt',dor:'concorrência forte e pouca presença digital',f:4,t:3,x:3},
 {n:'Mercados e conveniências',p:'mkt',dor:'promoções diárias que precisam de divulgação',f:4,t:2,x:4},
 {n:'Clínicas de estética e odontologia',p:'mkt',dor:'ticket alto por paciente, divulgação irregular',f:3,t:4,x:2},
 {n:'Restaurantes e delivery',p:'mkt',dor:'dependem de iFood e querem vender direto',f:4,t:2,x:2},
 {n:'Autoescolas',p:'pod',dor:'leads do WhatsApp sem funil de acompanhamento',f:5,t:3,x:5},
 {n:'Laboratórios de análise de água',p:'lab',dor:'laudos por Portaria 888 em planilha, sem rastreabilidade',f:4,t:4,x:4},
 {n:'Terminais e usinas de açúcar',p:'lab',dor:'controle ICUMSA e laudos de navio manuais',f:3,t:5,x:5},
 {n:'Trading e empresas de inspeção',p:'lab',dor:'consolidar laudos de vários laboratórios',f:3,t:4,x:4},
 {n:'Laboratórios de solo e efluentes',p:'lab',dor:'muitas amostras e emissão de laudo repetitiva',f:3,t:3,x:2},
 {n:'Redes de lojas e franquias',p:'rc',dor:'supervisão de campo sem comprovação',f:3,t:4,x:3},
 {n:'Empresas de merchandising/promotores',p:'rc',dor:'precisam provar visita ao cliente final',f:3,t:4,x:2},
 {n:'Limpeza e segurança patrimonial',p:'rc',dor:'fiscalização de postos em campo',f:3,t:4,x:2},
 {n:'Criadores de economia doméstica (parceria)',p:'sc',dor:'audiência que quer economizar no mercado',f:2,t:1,x:2}
];
const STAGES=['Prospectado','Abordado','Respondeu','Demo / Visita','Proposta','Fechado','Perdido'];
const KEY='radar_prospeccao_v1';
let S={city:'Praia Grande',extra:[],leads:[],videos:{},camp:'bf'};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const VBASE='https://gdomingues41.github.io/mkt-geo-app/videos/';
const DEF_VID={'Salões de beleza e barbearias':VBASE+'barbearia.mp4','Joalherias e relojoarias':VBASE+'joalheria.mp4','Autopeças e oficinas':VBASE+'maqtec.mp4','Confeitarias e docerias':VBASE+'doceria-josi.mp4'};
S.videos=Object.assign({},DEF_VID,S.videos||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let ui={tab:'dash',prod:'mkt',busy:'',editing:null,approach:null,ai:null};
let sample=null;
try{if(window.claude&&claude.use){claude.use('sample').then(s=>{sample=s;render();}).catch(()=>{});}}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prod=id=>PRODUCTS.find(p=>p.id===id)||PRODUCTS[0];
const score=n=>((3*n.f+2*n.x+2*n.t)/7);
const allNiches=()=>SEED.concat(S.extra).slice().sort((a,b)=>score(b)-score(a));

const MENU=[['dash','📊','Dashboard'],['busca','🔎','Buscar leads'],['funil','📋','Funil'],['clientes','👥','Clientes'],['nichos','🎯','Nichos'],['produtos','📦','Produtos'],['dados','💾','Dados']];
function go(t){ui.tab=t;ui.menu=false;window.scrollTo(0,0);render();}
function toggleMenu(){ui.menu=!ui.menu;renderMenu();}
function actTab(){return ui.tab==='cliente'?(ui.prevTab||'clientes'):ui.tab;}
function renderMenu(){
  const act=actTab(),cnt={funil:S.leads.length,clientes:S.leads.length};
  $('#panel').classList.toggle('on',!!ui.menu);$('#scrim').classList.toggle('on',!!ui.menu);
  $('#panel').innerHTML='<div style="font-weight:700;margin:4px 8px 12px">📡 Radar de Prospecção</div>'+MENU.map(m=>`<button class="mi ${act===m[0]?'on':''}" onclick="go('${m[0]}')"><span>${m[1]}</span>${m[2]}${cnt[m[0]]?`<small>${cnt[m[0]]}</small>`:''}</button>`).join('');
}
function render(){
  renderMenu();
  const cur=ui.tab==='cliente'?['👤','Cliente']:MENU.find(m=>m[0]===ui.tab)||MENU[0];
  $('#ttl').textContent=cur[2]||cur[1];
  const views={dash:vDash,busca:vBusca,funil:vFunil,clientes:vClientes,cliente:vCliente,nichos:vNichos,produtos:vProdutos,dados:vDados};
  $('#app').innerHTML=(views[ui.tab]||vDash)();
}

function bfDate(y){const d=new Date(y,10,1);const first=(4-d.getDay()+7)%7;return new Date(y,10,1+first+21+1);}
function camps(){
  const y=new Date().getFullYear(),t=new Date();t.setHours(0,0,0,0);
  const bf=bfDate(y),nat=new Date(y,11,25),fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const dl=d=>Math.round((d-t)/864e5);
  return {bf:{nome:'Black Friday',art:'a',dias:dl(bf),data:fmt(bf)},natal:{nome:'Natal',art:'o',dias:dl(nat),data:fmt(nat)}};
}
const AREAS=['Praia Grande','Boqueirão, Praia Grande','Guilhermina, Praia Grande','Ocian, Praia Grande','Tupi, Praia Grande','Vila Mirim, Praia Grande','Aviação, Praia Grande','Santos','São Vicente','Guarujá','Cubatão','Mongaguá','Itanhaém'];
function updFree(){const v=document.getElementById('qfree').value.trim();document.getElementById('qa').href=v?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v+' '+S.city):'#';}
function waLink(l,t){const d=(l.tel||'').replace(/\D/g,'');if(!d)return '';const num=d.length<=11?'55'+d:d;return 'https://wa.me/'+num+'?text='+encodeURIComponent(t);}
function markSent(id){const l=S.leads.find(x=>x.id===id);if(l&&l.stage===0){l.stage=1;l.at=Date.now();save();setTimeout(render,600);}}
const IMP_DEMO='';
function importLeads(){
  const nn=document.getElementById('imp_n').value,n=allNiches().find(x=>x.n===nn)||{n:nn,p:'mkt'};
  const have=new Set(S.leads.map(l=>(l.tel||'').replace(/\D/g,'')).filter(Boolean));
  let add=0,skip=0;
  document.getElementById('imp_t').value.split('\n').forEach(line=>{
    const parts=line.split(/;|\t/).map(x=>x.trim());if(!parts[0])return;
    const tel=parts[1]||'',dig=tel.replace(/\D/g,'');
    if(dig&&have.has(dig)){skip++;return;}
    if(dig)have.add(dig);
    S.leads.push({id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),nome:parts[0],tel:tel,nicho:n.n,prod:n.p,stage:0,nota:parts[2]||'',cidade:S.city});add++;
  });
  save();ui.impMsg=add+' leads importados'+(skip?' ('+skip+' repetidos ignorados)':'')+'.';render();
}
function campKey(l){const n=allNiches().find(x=>x.n===l.nicho)||{};return n.camp||S.camp;}
function mapsA(t,label){return `<a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t+' '+S.city)}">🔎 ${esc(label)}</a>`;}
function setVid(idx,v){S.videos=S.videos||{};S.videos[allNiches()[idx].n]=v.trim();save();render();}
function vNichos(){
  const list=allNiches().filter(n=>ui.prod==='all'||n.p===ui.prod);
  const cs=camps(),cl=c=>c.dias>0?`${c.dias} dias (${c.data})`:'é agora';
  return `
  <div class="card" style="border-color:#0f766e">
    <b>🎯 Foco: MKT Geo · campanhas de fim de ano</b>
    <div class="muted" style="margin:4px 0 8px">Black Friday: ${cl(cs.bf)} · Natal: ${cl(cs.natal)}</div>
    <div class="chips" style="padding-bottom:0">
      ${[['bf','Black Friday'],['natal','Natal'],['none','Sem campanha']].map(([k,t])=>`<button class="chip ${S.camp===k?'on':''}" onclick="S.camp='${k}';save();render()">${t}</button>`).join('')}
    </div>
    <div class="muted">A campanha escolhida entra automática nas mensagens do MKT Geo.</div>
  </div>
  <div class="note">Nota = 3×facilidade + 2×proximidade + 2×ticket (de 1 a 5). É uma estimativa inicial: ajuste conforme os resultados reais do funil.</div>
  <label>Onde buscar (toque para trocar, ou digite qualquer bairro/cidade)</label>
  <div class="chips">${AREAS.map(a=>`<button class="chip ${S.city===a?'on':''}" onclick="S.city='${a}';save();render()">${a}</button>`).join('')}</div>
  <input value="${esc(S.city)}" onchange="S.city=this.value;save();render()">
  <label>Busca livre no Maps (qualquer termo)</label>
  <div class="row" style="flex-wrap:nowrap"><input id="qfree" placeholder="ex.: bolo no pote, cake design" oninput="updFree()"><a id="qa" class="btn" target="_blank" rel="noopener" href="#" style="white-space:nowrap">🔎 Buscar</a></div>
  <div class="chips" style="margin-top:10px">
    <button class="chip ${ui.prod==='all'?'on':''}" onclick="ui.prod='all';render()">Todos</button>
    ${PRODUCTS.map(p=>`<button class="chip ${ui.prod===p.id?'on':''}" onclick="ui.prod='${p.id}';render()">${esc(p.nome)}</button>`).join('')}
  </div>
  <div class="row" style="margin-bottom:12px">
    ${sample?`<button class="btn pri" ${ui.busy?'disabled':''} onclick="mapNichos()">${ui.busy==='nichos'?'Pensando…':'✨ Mapear mais nichos com IA'}</button>`:'<span class="muted">IA indisponível nesta visualização; use os nichos da lista.</span>'}
  </div>
  ${ui.ai?`<div class="note">${esc(ui.ai)}</div>`:''}
  ${list.map((n,i)=>{const q=encodeURIComponent(n.n+' '+S.city);const idx=allNiches().indexOf(n);return `
  <div class="card">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <div><b>${esc(n.n)}</b><div style="margin:4px 0"><span class="tag p">${esc(prod(n.p).nome)}</span></div><div class="muted">${esc(n.dor)}</div></div>
      <div class="score">${score(n).toFixed(1)}</div>
    </div>
    ${n.p==='mkt'?`<label>Vídeo-demo deste nicho ${(S.videos||{})[n.n]?'':'<span class="tag">sem vídeo</span>'}</label><input placeholder="Cole o link do vídeo (GitHub Pages, Drive, YouTube...)" value="${esc((S.videos||{})[n.n]||'')}" onchange="setVid(${idx},this.value)">`:''}
    <div class="row" style="margin-top:10px">
      ${n.q&&n.q.length?n.q.map(t=>mapsA(t,t)).join(''):mapsA(n.n,'Buscar no Maps')}
      ${n.ig?`<a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('site:instagram.com '+n.ig+' '+S.city)}">📸 Instagram</a>`:''}
      <button class="btn sm pri" onclick="newLead(${idx})">+ Lead</button>
    </div>
  </div>`}).join('')}`;
}

async function mapNichos(){
  if(!sample)return;
  ui.busy='nichos';ui.ai=null;render();
  const ids=ui.prod==='all'?PRODUCTS.filter(p=>p.id!=='sc'):[prod(ui.prod)];
  const have=allNiches().map(n=>n.n).join('; ');
  try{
    let added=0;
    for(const p of ids){
      const r=await sample.json(`Você é estrategista de vendas B2B no Brasil. Produto: ${p.nome} — ${p.oferta}. Preço: ${p.preco}. Dor que resolve: ${p.dor}. Região-base: ${S.city} e Baixada Santista (SP). Liste 3 nichos de negócios locais NOVOS (diferentes destes: ${have}) onde esse produto venderia bem para pequenas e médias empresas. Responda SOMENTE um array JSON de objetos {"n":"nome do nicho","dor":"dor específica em uma frase","f":facilidade de fechar 1-5,"t":ticket 1-5}.`,{modelTier:'quick'});
      (Array.isArray(r)?r:[]).forEach(x=>{if(x&&x.n&&!allNiches().some(y=>y.n.toLowerCase()===String(x.n).toLowerCase())){S.extra.push({n:String(x.n),p:p.id,dor:String(x.dor||''),f:Math.min(5,Math.max(1,+x.f||3)),t:Math.min(5,Math.max(1,+x.t||3)),x:2});added++;}});
    }
    ui.ai=added?`${added} nichos novos adicionados pela IA (proximidade começa em 2).`:'A IA não trouxe nichos novos desta vez.';
    save();
  }catch(e){ui.ai='Não consegui mapear agora ('+(e&&e.code||'erro')+'). Tente de novo em instantes.';}
  ui.busy='';render();
}


const API_URL='https://radarapi.vercel.app/api/buscar';
function getTok(){try{return localStorage.getItem('radar_token')||'';}catch(e){return '';}}
function setTok(v){try{localStorage.setItem('radar_token',v.trim());}catch(e){}ui.err='';render();}
function clearTok(){try{localStorage.removeItem('radar_token');}catch(e){}render();}
async function buscarMaps(more){
  const tok=getTok();
  if(!tok){ui.err='Cole a senha do Radar primeiro.';render();return;}
  const termo=(document.getElementById('bm_t')||{}).value||ui.bmT||'';
  const nicho=(document.getElementById('bm_n')||{}).value||ui.bmN||'';
  if(termo.trim().length<2){ui.err='Digite o que buscar.';render();return;}
  ui.bmT=termo;ui.bmN=nicho;ui.bmBusy=true;ui.err='';render();
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-radar-token':tok},
      body:JSON.stringify({termo:termo.trim(),cidade:S.city,pageToken:more?ui.bmNext:''})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ui.err=r.status===401?'Senha inválida. Confira e cole de novo.':(d.erro||'Erro na busca.');}
    else{ui.bmRes=(more?(ui.bmRes||[]):[]).concat(d.leads||[]);ui.bmNext=d.nextPageToken||'';if(!ui.bmRes.length)ui.err='Nada encontrado. Tente outro termo ou bairro.';}
  }catch(e){ui.err='Não consegui falar com o servidor. Abra o Radar pela página hospedada (github.io), não por dentro do Claude.';}
  ui.bmBusy=false;render();
}
function leadFromRes(r){
  const nn=ui.bmN||'Confeitarias e docerias',n=allNiches().find(x=>x.n===nn)||{n:nn,p:'mkt'};
  const d=r.diagnostico||{},probs=(d.problemas||[]).map(p=>p.texto).join('; ');

  return `<div class="row" style="margin-bottom:10px"><button class="btn pri" onclick="newLead(-1)">+ Novo lead</button></div>
  <input placeholder="Buscar por nome, nicho ou telefone" value="${esc(ui.q||'')}" oninput="ui.q=this.value;document.getElementById('cl_list').innerHTML=listaClientes()">
  <div class="chips" style="margin-top:8px"><button class="chip ${(ui.sf==null||ui.sf<0)?'on':''}" onclick="ui.sf=-1;render()">Todos</button>${STAGES.map((st,i)=>`<button class="chip ${ui.sf===i?'on':''}" onclick="ui.sf=${i};render()">${st}</button>`).join('')}</div>
  <div id="cl_list">${listaClientes()}</div>`;
}
function vDash(){
  const L=S.leads,cs=camps(),cl=c=>c.dias>0?`${c.dias} dias (${c.data})`:'é agora',hoje=Date.now(),DIA=864e5;
  const n=f=>L.filter(f).length,abord=n(l=>l.stage>=1&&l.stage!==6);
  const novos=L.filter(l=>l.stage===0&&waLink(l,'x')),fol=L.filter(l=>l.stage===1&&(!l.at||hoje-l.at>2*DIA)),quentes=L.filter(l=>l.stage>=2&&l.stage<=4);
  const row=l=>`<div class="lead click" onclick="openApproach('${l.id}')" style="margin-top:8px"><b>${esc(l.nome)}</b><span class="tag">${esc(l.nicho||'')}</span><span class="tag p">${STAGES[l.stage]}</span></div>`;
  const sec=(t,arr,vazio)=>`<div class="card"><b>${t}</b> <span class="muted">(${arr.length})</span>${arr.slice(0,6).map(row).join('')||`<div class="muted" style="margin-top:6px">${vazio}</div>`}${arr.length>6?`<div class="muted" style="margin-top:6px">+${arr.length-6} no funil</div>`:''}</div>`;
  const meta=10,pct=Math.min(100,Math.round(abord/meta*100));
  return `<div class="stats">
    <div class="stat"><b>${L.length}</b>leads</div><div class="stat"><b>${abord}</b>abordados</div>
    <div class="stat"><b>${n(l=>l.stage>=2&&l.stage!==6)}</b>responderam</div><div class="stat"><b>${n(l=>l.stage===4)}</b>propostas</div>
    <div class="stat"><b>${n(l=>l.stage===5)}</b>fechados</div></div>
  <div class="card" style="border-color:#0f766e"><b>🎯 Meta: 10 abordagens</b> <span class="muted">${abord}/${meta}</span>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="muted" style="margin-top:8px">Black Friday: ${cl(cs.bf)} · Natal: ${cl(cs.natal)}</div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="go('busca')">🔎 Buscar leads</button><button class="btn" onclick="go('funil')">📋 Funil</button><button class="btn" onclick="go('clientes')">👥 Clientes</button></div>
  ${sec('📲 Prontos para a 1ª mensagem',novos,'Nenhum lead novo com WhatsApp. Busque mais em Buscar leads.')}
  ${sec('⏰ Follow-up (sem resposta há 2 dias)',fol,'Nenhum follow-up pendente.')}
  ${sec('🔥 Conversas em andamento',quentes,'Ninguém respondeu ainda.')}`;
}
async function genApproach(){
  const a=ui.approach;if(!sample||a.busy)return;a.busy=true;drawApproach();
  const l=a.lead,p=prod(l.prod);
  try{
    const r=await sample.json(`Você é um vendedor consultivo brasileiro, tom natural de WhatsApp, curto, sem exageros e sem emojis em excesso. Escreva a abordagem para este lead.
Empresa: ${l.nome}. Nicho: ${l.nicho}. Cidade: ${S.city}. Observações: ${l.nota||'nenhuma'}.
Produto: ${p.nome} — ${p.oferta}. Preço: ${p.preco}. Dor que resolve: ${p.dor}.
Quem escreve: Gabriel, de Praia Grande/Santos, 13 anos de experiência em laboratório e desenvolvedor dos próprios sistemas.
Campanha em foco: ${campKey(l)==='bf'?'Black Friday':campKey(l)==='natal'?'Natal':'nenhuma'}. Link do vídeo-demo do nicho: ${(S.videos||{})[l.nicho]||'nenhum'}. ${campKey(l)==='bf'&&l.prod==='mkt'?'Preço do vídeo avulso na Black Friday: R$79 (normal R$149,90).':''} Não prometa prazos, descontos ou resultados que não foram informados.
Regras: a 1ª mensagem NÃO vende, só faz uma pergunta sobre a dor; a 2ª só oferece uma demonstração curta sem compromisso; nunca invente resultados nem números.
Responda SOMENTE JSON: {"m1":"...","m2":"...","m3":"follow-up curto","obj":"resposta à objeção mais provável para esse nicho"}`,{modelTier:'default'});
    if(r&&r.m1){a.m=Object.assign(a.m,{m1:r.m1,m2:r.m2||a.m.m2,m3:r.m3||a.m.m3,obj:r.obj||a.m.obj});a.ai=true;}
  }catch(e){}
  a.busy=false;drawApproach();
}
async function cp(id,btn){
  const t=document.getElementById(id);
  try{await navigator.clipboard.writeText(t.value);btn.textContent='Copiado ✓';}
  catch(e){t.select();btn.textContent='Selecionado: copie manualmente';}
}

function vProdutos(){
  return PRODUCTS.map(p=>`<div class="card"><b>${esc(p.nome)}</b>
  <div class="muted" style="margin:4px 0">${esc(p.oferta)}</div>
  <div class="muted"><b>Preço:</b> ${esc(p.preco)}</div>
  <div class="muted"><b>Dor:</b> ${esc(p.dor)}</div>
  <div class="muted"><b>Pergunta de abertura:</b> ${esc(p.pergunta)}</div></div>`).join('');
}

function vDados(){
  return `<div class="note">Os dados ficam só neste navegador. Para não perder nada, copie o backup abaixo de vez em quando.</div>
  <label>Backup (copie e guarde)</label><textarea id="bk" style="min-height:140px">${esc(JSON.stringify(S))}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="cp('bk',this)">Copiar backup</button>
  <button class="btn pri" onclick="restore()">Restaurar do texto acima</button></div>
  <div class="muted" id="bkmsg" style="margin-top:8px"></div>`;
}
function restore(){
  try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.leads))throw 0;S=Object.assign({city:'Praia Grande',extra:[],leads:[],videos:{},camp:'bf'},o);save();render();}
  catch(e){$('#bkmsg').textContent='Texto inválido. Cole o backup completo e tente de novo.';}
}

function openModal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
render();
</script>
</body>
</html>
